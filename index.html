<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Art Museum Gallery | Шедевры мирового искусства</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <img class="logo-img" src="./image/4.jpeg" alt="museum icon" loading="lazy" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg'">
    <div>
      <h1>🎨 Art Museum</h1>
      <p>шедевры сквозь время</p>
    </div>
  </div>
  <button class="theme-btn" id="themeToggleBtn">🌙 Тёмная эстетика</button>
</header>

<section class="hero">
  <div class="hero-content">
    <h2>Галерея вдохновения</h2>
    <p>Классика • Авангард • Символизм</p>
  </div>
</section>

<div class="toolbar">
  <div class="toolbar-group">
    <button class="add-btn" id="openModalBtn">✨ Добавить шедевр</button>
    <input type="text" id="searchInput" placeholder="Поиск по названию или автору" autocomplete="off">
    <select id="categoryFilter">
      <option value="all">🎭 Все жанры</option>
      <option value="Портрет">🖼️ Портрет</option>
      <option value="Природа">🌿 Природа</option>
      <option value="Абстракция">🌀 Абстракция</option>
      <option value="Мифология">🏛️ Мифология</option>
      <option value="Натюрморт">🍎 Натюрморт</option>
      <option value="Пейзаж">🏞️ Пейзаж</option>
      <option value="Исторический">🏰 Исторический</option>
      <option value="Батальный">⚔️ Батальный</option>
      <option value="Религиозный">⛪ Религиозный</option>
      <option value="Городской пейзаж">🏙️ Городской пейзаж</option>
    </select>
    <select id="authorFilter">
      <option value="all">👨‍🎨 Все авторы</option>
    </select>
    <select id="sortSelect">
      <option value="date_new">📅 Новые сначала</option>
      <option value="date_old">📅 Старые сначала</option>
      <option value="author_asc">👤 Автор (А-Я)</option>
      <option value="title_asc">🔤 Название (А-Я)</option>
    </select>
  </div>
</div>

<section class="gallery" id="galleryContainer"></section>

<!-- MODAL ДОБАВЛЕНИЯ -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <h2>➕ Новое произведение</h2>
    <input type="text" id="artTitle" placeholder="Название картины *" autocomplete="off">
    <input type="text" id="artAuthor" placeholder="Художник *" autocomplete="off">
    <select id="artCategory">
      <option value="Портрет">Портрет</option>
      <option value="Природа">Природа</option>
      <option value="Абстракция">Абстракция</option>
      <option value="Мифология">Мифология</option>
      <option value="Натюрморт">Натюрморт</option>
      <option value="Пейзаж">Пейзаж</option>
      <option value="Исторический">Исторический</option>
      <option value="Батальный">Батальный</option>
      <option value="Религиозный">Религиозный</option>
      <option value="Городской пейзаж">Городской пейзаж</option>
    </select>
    
    <label style="font-weight: bold; margin-bottom: 6px; display: block;">🖼️ Загрузить изображение:</label>
    <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/webp,image/jpg">
    
    <label style="font-weight: bold; margin: 12px 0 4px 0; display: block;">🔗 или вставить URL картины:</label>
    <input type="text" id="imageUrlInput" placeholder="https://example.com/painting.jpg" autocomplete="off">
    <span class="url-hint">* Укажите ссылку, если не загружаете файл</span>
    
    <img id="imagePreview" class="preview-img" alt="предпросмотр">
    
    <button class="add-btn" id="saveArtBtn" style="width: 100%; justify-content: center; margin-top: 12px;">💾 Сохранить в галерею</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightboxModal">
  <div class="close-lightbox" id="closeLightboxBtn">&times;</div>
  <div class="lightbox-container">
    <img id="lightboxImage" alt="large view">
    <div id="lightboxMagnifier"></div>
  </div>
  <div class="lightbox-text" id="lightboxCaption"></div>
</div>

<footer>
  © 2026 Art Museum Gallery — Сохраняем искусство в цифре
</footer>

<script src="gallery.js"></script>
</body>
</html>
